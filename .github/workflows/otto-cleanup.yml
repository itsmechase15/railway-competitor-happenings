name: One-shot cleanup (Otto)

on:
  push:
    branches: [main]
    paths: [".github/workflows/otto-cleanup.yml"]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete Discord messages (issue #10 / Flat Rate CDN / CDN metadata)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, urllib.request
          token = os.environ["DISCORD_BOT_TOKEN"]
          channel = os.environ["DISCORD_CHANNEL_ID"]
          patterns = [re.compile(x, re.I) for x in [r"issues/10\b", r"cdn metadata", r"flat.?rate.?cdn", r"91%", r"Consider enhancing CDN", r"introducing-flat-rate-cdn", r"how-we-cut-cdn-metadata"]]
          req = urllib.request.Request(f"https://discord.com/api/v10/channels/{channel}/messages?limit=50", headers={"Authorization": f"Bot {token}", "User-Agent": "otto-cleanup"})
          with urllib.request.urlopen(req) as resp: messages = json.load(resp)
          deleted = []
          for m in messages:
              if any(p.search(json.dumps(m)) for p in patterns):
                  mid = m["id"]
                  dreq = urllib.request.Request(f"https://discord.com/api/v10/channels/{channel}/messages/{mid}", method="DELETE", headers={"Authorization": f"Bot {token}", "User-Agent": "otto-cleanup"})
                  with urllib.request.urlopen(dreq) as dresp:
                      print(f"deleted Discord message {mid} status={dresp.status}")
                      deleted.append(mid)
          print(f"Discord deleted_count={len(deleted)} ids={deleted}")
          PY

      - name: GraphQL deleteIssue #10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NODE_ID=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/itsmechase15/railway-competitor-happenings/issues/10 | python3 -c 'import sys,json; print(json.load(sys.stdin).get("node_id",""))')
          if [ -z "$NODE_ID" ]; then echo "Issue #10 already gone"; exit 0; fi
          RESP=$(curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -d "{\"query\":\"mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}\",\"variables\":{\"id\":\"$NODE_ID\"}}")
          echo "$RESP"
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("data",{}).get("deleteIssue") is not None, d; print("DELETE_OK")'

      - uses: actions/checkout@v4
      - name: Remove this cleanup workflow from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/otto-cleanup.yml
          git add -A
          git commit -m "chore: remove one-shot otto cleanup workflow"
          git push
