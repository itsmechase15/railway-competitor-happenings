name: Force post one item

# Posts a single named announcement to Discord, ignoring the dedupe table and
# the first-run seed guard. Two ways in, because the Actions tab is not always
# the hand on the trigger:
#
#   1. Run it from the Actions tab and pass the URL as `force_url`.
#   2. Commit the URL to .github/force-post-url.txt. Merging that to main posts
#      it, which leaves the request itself in the git history.
on:
  workflow_dispatch:
    inputs:
      force_url:
        description: "Announcement URL to post. It has to still be in a live feed"
        required: true
        type: string
      dry_run:
        description: "Print the Discord payload instead of posting it"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/force-post-url.txt"]

# Shared with the daily run so the two can never post over each other.
concurrency:
  group: competitor-happenings
  cancel-in-progress: false

# `contents: write` is for the Before/After picture on an update_pages issue,
# which is committed to artifacts/update-pages/ so GitHub can render it inline.
# Same reason as the daily run, and the only thing here that writes to the repo.
permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    # One item, but the analyst still builds and searches the docs corpus, and
    # every action it files is reviewed against the same corpus afterwards.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the URL to post
        id: target
        env:
          FORCE_URL: ${{ inputs.force_url }}
        run: |
          url="$FORCE_URL"
          if [ -z "$url" ]; then
            url="$(grep -v '^[[:space:]]*#' .github/force-post-url.txt | grep -m1 -oE 'https?://[^[:space:]]+' || true)"
          fi
          if [ -z "$url" ]; then
            # A push that touched the file without leaving a URL in it is how
            # the file looks between force posts, and every commented-out line
            # is a deliberate "nothing to post". Failing that run would paint
            # main red for doing exactly what was asked.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "No URL in .github/force-post-url.txt – nothing to post."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Nothing to post: pass force_url, or put a URL in .github/force-post-url.txt." >&2
            exit 1
          fi
          echo "Posting $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.target.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.target.outputs.proceed == 'true'

      - run: npm run build
        if: steps.target.outputs.proceed == 'true'

      # Same as the daily run: it photographs the page an update_pages issue is
      # about, and a run without it files the issue in text instead.
      - name: Install Chromium for the before/after images
        if: steps.target.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      # Names a missing secret before anything reaches a vendor. DRY_RUN is set
      # so the database stays optional here, as it is for the post itself.
      - name: Check the secrets are there
        if: steps.target.outputs.proceed == 'true'
        run: node dist/setup/check-env.js
        env:
          DRY_RUN: "true"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # DRY_RUN above excuses the channel id from this check, since a dry
          # run prints instead of posting. It is here so the check still sees
          # what the step below will actually deliver with.
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      # Before the pipeline, because it opens a GitHub issue on the way to
      # Discord and an undeliverable alert should not leave one behind.
      - name: Check the Discord bot can see the channel
        if: steps.target.outputs.proceed == 'true'
        run: node dist/index.js --check-discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}

      - name: Post it
        if: steps.target.outputs.proceed == 'true'
        run: node dist/index.js --url "${{ steps.target.outputs.url }}"
        env:
          # Unset here means an in-memory store: the post still goes out, it
          # just leaves no dedupe trace behind.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Force-post shares prepareAlert with the daily run, so it reviews what
          # it files the same way. Unset falls back to the defaults in config.ts.
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          UPDATER_MODEL: ${{ vars.UPDATER_MODEL }}
          REVIEW_MAX_PER_RUN: ${{ vars.REVIEW_MAX_PER_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
