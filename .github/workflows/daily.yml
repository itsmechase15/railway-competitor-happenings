name: Daily competitor happenings

on:
  schedule:
    # 14:00 UTC is 07:00 PT during daylight saving time, which is what the plan
    # asks for. The second entry covers the winter, and the guard below drops
    # whichever of the two lands before 07:00 in Los Angeles today.
    - cron: "0 14 * * *" # 07:00 PDT
    - cron: "0 15 * * *" # 07:00 PST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Discord payloads instead of posting them"
        type: boolean
        default: false

concurrency:
  group: competitor-happenings
  cancel-in-progress: false

# Each alert links a GitHub issue holding the detail the embed no longer carries.
#
# `contents: write` is for one thing: an update_pages issue shows a Before/After
# picture of the paragraph it is asking somebody to edit, and GitHub only renders
# an image it can fetch, so the PNG is committed to artifacts/update-pages/ first.
# Nothing else here writes to the repo.
permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    # The analyst reads its way around Railway's whole docs corpus per item, and
    # every action it files then gets a reviewer run of its own over the same
    # corpus, with a rewrite for the ones that need correcting. That is where the
    # extra quarter of an hour goes.
    timeout-minutes: 45
    steps:
      - name: Check it is not before 07:00 in America/Los_Angeles
        id: window
        run: |
          hour="$(TZ=America/Los_Angeles date +%H)"
          # Only a too-early run bails. GitHub delays scheduled workflows under
          # load – an exact 07 match turns any late start into a silently
          # skipped day – and dedupe makes a second entry a no-op if both land.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 7 ]; then
            echo "Local hour is $hour – too early, the later cron entry covers today."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.window.outputs.proceed == 'true'

      - run: npm run build
        if: steps.window.outputs.proceed == 'true'

      # Opens the page an update_pages issue is about and photographs it before
      # and after. A run without it still files every issue, in text, so this is
      # not a hard requirement – it is installed explicitly rather than relying
      # on npm's postinstall so a failure to fetch it says so here instead of at
      # the point of taking the shot.
      - name: Install Chromium for the before/after images
        if: steps.window.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      # Fails in seconds, naming the secret and where its value comes from,
      # rather than twenty minutes in as a Postgres timeout or a silent channel.
      - name: Check the secrets are there
        if: steps.window.outputs.proceed == 'true'
        run: node dist/setup/check-env.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # The preflight judges the channel id too, so it has to be able to
          # see it. Reading it only in the step below would let a missing
          # channel through the check that exists to catch exactly that.
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Run one cycle
        if: steps.window.outputs.proceed == 'true'
        run: node dist/index.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # The review pass. All three are optional: unset falls back to the
          # defaults in src/config.ts, which are claude-fable-5-1 reviewing and
          # the analyst's own model rewriting.
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          UPDATER_MODEL: ${{ vars.UPDATER_MODEL }}
          REVIEW_MAX_PER_RUN: ${{ vars.REVIEW_MAX_PER_RUN }}
          # Provided by Actions; opens the issue each embed links to, and writes
          # the review verdict back onto it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # A channel id is not really a secret, but it is easy to store as one,
          # and reading only `vars` there leaves it silently empty.
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
