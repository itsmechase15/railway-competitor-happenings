name: Check secrets

# The first thing to run on a fresh clone. It reads nothing but the presence of
# each secret, names the ones that are missing, and says where each value comes
# from. It never prints a value, and it posts nothing.
#
# Actions → Check secrets → Run workflow. Tick strict for the full inventory,
# which is what you want before the first daily run. Only the required secrets
# fail the run either way: X is optional, and a repo without it posts every
# morning from the changelogs and blogs.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "List every variable and whether it is set, optional ones included"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level rather than per step, so the Discord step can ask whether there
    # is a token to check before it spends a call finding out.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the secrets are there
        run: npm run check-env ${{ inputs.strict && '-- --strict' || '' }}

      # A token that cannot see the channel is the failure a secrets check is
      # meant to catch, and only Discord can answer that. Skipped when there is
      # no token.
      - name: Ask Discord what the bot can see
        if: env.DISCORD_BOT_TOKEN != ''
        run: npm run run -- --check-discord
