name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Before/After is two screenshots of the real page, and the code that
      # finds the line on it and swaps the copy runs inside the browser. That is
      # the part that can be wrong, so the browser is here rather than skipped:
      # without it those tests skip themselves and nothing checks them until a
      # morning run does.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
